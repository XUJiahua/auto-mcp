server:
  mode: http
  port: 8080
  host: "0.0.0.0"
  timeout: 30s
  name: "Auto MCP"
  version: "1.0.0"

logging:
  level: "info"
  format: "json"
  color: true
  disable_stacktrace: false
  output_path: "logs/auto-mcp.log"
  append_to_file: true
  disable_console: false

endpoint:
  base_url: "https://petstore.swagger.io/v2"

# A container has to bind 0.0.0.0 to be reachable through a published port, and
# a reachable MCP endpoint has to be able to tell its callers apart, so a
# credential is required. Set AUTO_MCP_DOWNSTREAM_TOKEN when running this
# example; binding host to localhost instead removes the requirement.
security_schemes:
  - id: caller
    type: http
    scheme: bearer
    default_credential: "${AUTO_MCP_DOWNSTREAM_TOKEN}"

downstream_security:
  id: caller

oauth:
  enabled: false
  provider: github
  client_id: ""
  client_secret: ""
  scopes: ""
  allow_origins: []

swagger_file: "/config/swagger.json"
