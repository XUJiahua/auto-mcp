server:
  mode: sse # or stdio
  port: 8080
  host: "localhost"
  timeout: 30s
  name: "Auto MCP"
  version: "1.0.0"

logging:
  level: "info"
  format: "json"
  color: true
  disable_stacktrace: false
  output_path: "logs/auto-mcp.log"
  append_to_file: true
  disable_console: false

endpoint:
  base_url: "http://localhost:3000"

# Credentials are described once and referred to by direction. Omit both
# requirements for an upstream that needs no credential; a host reachable from
# off this machine must set downstream_security (or enable oauth).
# security_schemes:
#   - id: upstream_key
#     type: apiKey
#     in: header
#     name: X-API-Key
#     default_credential: "${UPSTREAM_API_KEY}"
# upstream_security:
#   id: upstream_key

oauth:
  enabled: true
  provider: github
  client_id: "client_id"
  client_secret: "client_secret"
  scopes: "openid email profile"
  allow_origins:
    - "http://127.0.0.1:6274" # mcp inspector default endpoint
